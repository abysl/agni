[package]
name = "agni-importers"
version = "0.1.0"
edition = "2021"

[dependencies]
agni-deck = { path = "../games/deck" }
agni-mtg = { path = "../games/mtg", optional = true }
agni-riftbound = { path = "../games/riftbound", optional = true }
agni-sim = { path = "../sim", optional = true }
ciborium = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
spirit-core = { git = "https://github.com/abysl/spirit-library", optional = true }
spirit-schema = { git = "https://github.com/abysl/spirit-library", optional = true }
spirit-node = { git = "https://github.com/abysl/spirit-library", optional = true, default-features = false, features = [
  "native",
] }
ureq = { version = "2", features = ["json"], optional = true }
tokio = { version = "1", optional = true, default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "signal",
] }

[dev-dependencies]
ciborium = "0.2"
serde_json = "1"

[features]
default = []
art = ["dep:ciborium", "dep:serde", "dep:spirit-core", "dep:ureq"]
scryfall = ["art"]
mtg = ["dep:agni-mtg"]
mtg-native = ["mtg", "art"]
riftbound = ["dep:agni-riftbound", "dep:serde_json"]
riftbound-native = ["riftbound", "art"]
riftbound-gateway = [
  "riftbound-native",
  "dep:spirit-node",
  "dep:spirit-schema",
  "dep:agni-sim",
  "dep:tokio",
]

[lib]
name = "agni_importers"

[[bin]]
name = "ingest-scryfall"
path = "src/main.rs"
required-features = ["scryfall"]

[[bin]]
name = "ingest-riftbound"
path = "src/bin/ingest_riftbound.rs"
required-features = ["riftbound-native"]

[[bin]]
name = "resolve-riftbound"
path = "src/bin/resolve_riftbound.rs"
required-features = ["riftbound-native"]

[[bin]]
name = "deck-gateway"
path = "src/bin/deck_gateway.rs"
required-features = ["riftbound-gateway", "riftbound-native"]
